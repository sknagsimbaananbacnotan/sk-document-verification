<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Registry Admin</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#15243b}.top{background:#073b78;color:#fff;padding:20px}.wrap{max-width:1150px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #cbd6e4;border-radius:8px}button{background:#0755a5;color:#fff;border:0;font-weight:bold;cursor:pointer}.danger{background:#b42318}.muted{font-size:13px;color:#667085}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e7edf5;text-align:left;font-size:12px}.actions button{width:auto;margin-right:5px;padding:7px}#qr{display:flex;justify-content:center;padding:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="wrap"><h2>SK Nagsimbaanan • Document Registry</h2></div></div><div class="wrap"><div class="card" id="login"><h3>Administrative Login</h3><input id="password" type="password" placeholder="Admin password"><button onclick="doLogin()">Sign In</button><div id="loginMsg" class="muted"></div></div><div id="app" style="display:none"><div class="card"><h3>Register Official Document</h3><div class="grid"><div><label>Date Issued</label><input id="date_issued" type="date"></div><div><label>Document Type</label><input id="document_type" placeholder="Confirmation Letter / Certification / Invitation"></div><div><label>Recipient</label><input id="recipient"></div><div><label>Subject / Purpose</label><input id="subject"></div></div><textarea id="notes" placeholder="Internal notes (not displayed publicly)"></textarea><button onclick="createDoc()">Register & Generate Verification Number</button><div id="created"></div></div><div class="card"><h3>Official Document Registry</h3><div style="overflow:auto"><table><thead><tr><th>No.</th><th>Date</th><th>Type</th><th>Recipient</th><th>Subject</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>let token=localStorage.getItem('skdv_token')||'';date_issued.value=new Date().toISOString().slice(0,10);if(token)boot();async function doLogin(){loginMsg.textContent='Signing in…';const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:password.value})});const d=await r.json();if(r.ok){token=d.token;localStorage.setItem('skdv_token',token);boot()}else loginMsg.textContent=d.error||'Login failed'}async function boot(){const r=await fetch('/api/admin?action=list',{headers:{Authorization:'Bearer '+token}});if(!r.ok){localStorage.removeItem('skdv_token');token='';return}login.style.display='none';app.style.display='block';render((await r.json()).documents)}async function createDoc(){created.textContent='Registering…';const payload={action:'create',date_issued:date_issued.value,document_type:document_type.value,recipient:recipient.value,subject:subject.value,notes:notes.value};const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){created.textContent=d.error||'Failed';return}const url=location.origin+'/?id='+encodeURIComponent(d.document.document_no);created.innerHTML=`<hr><b>Registered:</b> ${d.document.document_no}<div id="qr"></div><p class="muted">QR destination: ${url}</p>`;new QRCode(document.getElementById('qr'),{text:url,width:160,height:160});boot()}function render(ds){rows.innerHTML=ds.map(x=>`<tr><td>${e(x.document_no)}</td><td>${e(x.date_issued)}</td><td>${e(x.document_type)}</td><td>${e(x.recipient)}</td><td>${e(x.subject)}</td><td>${e(x.status)}</td><td class="actions"><button onclick="copyLink('${e(x.document_no)}')">QR Link</button><button class="danger" onclick="revoke('${e(x.id)}')">Revoke</button></td></tr>`).join('')}function copyLink(no){navigator.clipboard.writeText(location.origin+'/?id='+no);alert('Verification link copied.')}async function revoke(id){if(!confirm('Revoke this document?'))return;await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'revoke',id})});boot()}function e(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
